<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;font-family:"Plus Jakarta Sans",system-ui,sans-serif;color:#fff;overflow:hidden;
background:radial-gradient(700px 400px at 95% -5%,rgba(255,122,64,.55),transparent 60%),radial-gradient(800px 500px at 0 0,rgba(29,91,255,.6),transparent 60%),linear-gradient(160deg,#0a1840,#143a8f 60%,#1d4bb8)}
.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.12) 1.5px,transparent 1.5px);background-size:30px 30px}
.wrap{position:relative;padding:70px 80px;height:100%;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:18px;font-size:44px;font-weight:800;letter-spacing:-1px}
.brand img{width:76px;height:76px}
.brand span{color:#ff8a4c}
h1{font-size:66px;line-height:1.06;letter-spacing:-2px;margin-top:50px;max-width:700px;font-weight:800}
h1 em{font-style:normal;background:linear-gradient(90deg,#ffb020,#ff6a2b);-webkit-background-clip:text;color:transparent}
p{margin-top:auto;font-size:28px;color:#c8d6ff;font-weight:600;display:flex;gap:28px}
p b{color:#fff}
.pass{position:absolute;right:80px;top:300px;background:#fff;color:#0b1b3b;border-radius:22px;padding:22px 26px;width:300px;box-shadow:0 30px 60px rgba(0,0,0,.35);transform:rotate(-4deg)}
.pass small{display:block;font-size:15px;font-weight:800;letter-spacing:2px;color:#5b6b88}
.pass strong{display:block;font-size:44px;letter-spacing:-1px}
.pass .t{display:inline-block;margin-top:8px;background:#e5f8f1;color:#0a8f66;font-weight:800;padding:6px 12px;border-radius:999px;font-size:18px}
</style></head><body><div class="dots"></div><div class="wrap">
<div class="brand"><img src="../assets/img/logo-mark.svg"><div>CheapFly<span>.ca</span></div></div>
<h1>Fly more. Pay <em>way less.</em><br>Free flight deal alerts for Canadians.</h1>
<p><b>16</b> airports · <b>80+</b> routes watched · <b>9</b> free tools</p>
</div>
<div class="pass"><small>DEAL THRESHOLD</small><strong>YYZ → LIS</strong><span class="t">Watch for a drop</span></div>
</body></html>
