name: Render brand images

on:
  push:
    branches: [main]
    paths:
      - "_branding/**"
      - "assets/img/logo-mark.svg"
      - ".github/workflows/brand-images.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: brand-images
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render PNGs with headless Chrome
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium-browser || command -v chromium)"
          echo "Using $CHROME"
          shot () {
            "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
              --default-background-color=00000000 --virtual-time-budget=6000 \
              --window-size="$2,$3" --screenshot="$GITHUB_WORKSPACE/assets/img/$4" \
              "file://$GITHUB_WORKSPACE/_branding/$1"
          }
          shot og.html 1200 630 og-image.png
          shot icon.html 32 32 favicon-32.png
          shot icon.html 180 180 apple-touch-icon.png
          shot icon.html 192 192 icon-192.png
          shot icon.html 512 512 icon-512.png
          ls -la assets/img

      - name: Commit rendered images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add assets/img/*.png
          if git diff --cached --quiet; then
            echo "No image changes."
          else
            git commit -m "Render brand images"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push && break
              sleep $((i * 5))
            done
          fi
