# Carry-on and personal-item limits, checked 2026-11-01.
# Dimensions are [length, width, height] in cm, largest first, wheels and handles included.
# "Verified" in a note means the figure matched the airline's own site in search results on 2026-11-01.
# Notes marked "not re-verified" are the airline's published policy as last known (mid-2026); the
# session's web-search budget ran out before they could be re-checked. Check them before publishing.
# Airlines change these often, so the tool should always say "verify with your airline before you fly".

